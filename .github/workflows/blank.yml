name: Android CI
on:
  push:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
           uses: actions/setup-java@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Build latest MuCuteRelay from source (jar trong app/libs cu, chi ho tro toi 1.21.70)
      run: |
        git clone --depth 1 https://github.com/OpenMITM/MuCuteRelay.git "$RUNNER_TEMP/MuCuteRelay"
        cd "$RUNNER_TEMP/MuCuteRelay"
        chmod +x gradlew
        ./gradlew uberJar --no-daemon
        cp build/libs/MuCuteRelay.jar "$GITHUB_WORKSPACE/app/libs/MuCuteRelay.jar"
        unzip -p "$GITHUB_WORKSPACE/app/libs/MuCuteRelay.jar" protocol_mapping.txt | tail -2
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Debug APK with Gradle
      run: ./gradlew assembleDebug
    - name: Build Release APK with Gradle
      run: ./gradlew assembleRelease
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
